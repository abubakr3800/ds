<!-- ══════════════════════════════════════════
     PAGE 1 — COVER / HERO
══════════════════════════════════════════ -->
<div class="page">
  <div class="page-main">
    <div class="scr-header">
      <img src="logo.png" alt="Short Circuit"/>
      <span class="doc-ref">{{ product.modelNumber }} · DATASHEET</span>
    </div>

    <!-- Layout matching Screenshot 5: Left hero + titles, Center orange divider, Right abstract -->
    <div style="display:flex;gap:8mm;align-items:stretch;min-height:165mm;margin-top:6mm;">

      <!-- LEFT: product image + product name + subtitle -->
      <div style="flex:1;display:flex;flex-direction:column;justify-content:flex-start;padding-right:6mm;">
        <div style="width:100%;height:85mm;display:flex;align-items:center;justify-content:center;margin-bottom:8mm;">
          {{#if product.heroImageUrl}}
            <img src="{{ product.heroImageUrl }}" alt="{{ product.name }}" style="max-width:100%;max-height:85mm;object-fit:contain;display:block;"/>
          {{else}}
            <span style="font-family:var(--font-body);color:var(--muted);font-size:12px;font-weight:600;">No image provided</span>
          {{/if}}
        </div>
        <div style="width:100%;text-align:left;">
          <div style="font-family:var(--font-hero);font-size:26px;font-weight:800;letter-spacing:1px;color:#111;line-height:1.2;">SHORT CIRCUIT</div>
          <div style="font-family:var(--font-hero);font-size:24px;font-weight:800;letter-spacing:1px;color:#111;line-height:1.2;margin-bottom:6mm;text-transform:uppercase;">{{ product.typeName }}</div>
          <p style="font-family:var(--font-body);font-size:11px;color:#333;line-height:1.5;">{{ product.subtitle }}</p>
        </div>
      </div>

      <!-- CENTER: Solid vertical orange dividing line -->
      <div style="width:2px;background-color:#E85A1B;align-self:stretch;margin:0 2mm;"></div>

      <!-- RIGHT: abstract -->
      <div style="flex:1;padding-left:8mm;padding-top:20mm;">
        <div style="color:#E85A1B;font-family:var(--font-hero);font-weight:700;font-size:13px;letter-spacing:1.5px;margin-bottom:5mm;text-transform:uppercase;">ABSTRACT</div>
        {{{ product.abstractHtml }}}
      </div>

    </div>
  </div>

  <!-- Screen footer -->
  <div class="scr-footer">
    <div class="fl">
      <div class="frow"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>{{ footer.address }}</div>
      <div class="frow"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>{{ footer.phone }}</div>
    </div>
    <div class="fr">
      <div class="frow"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>{{ footer.email }}</div>
      <div class="frow"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>{{ footer.website }}</div>
    </div>
  </div>
</div>
